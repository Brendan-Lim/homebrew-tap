name: Validate tap
on:
  push:
    branches: [main, 'preview/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
      - name: Audit published cask when available
        if: hashFiles('Casks/contextlens.rb') != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          # Read-only job token (permissions: contents: read). Without it, Homebrew's
          # GitHub API calls share the runner IP's anonymous rate limit and fail.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          # Audit this exact pushed/PR commit, rather than a stale copy of main.
          brew tap --custom-remote Brendan-Lim/tap "$GITHUB_WORKSPACE"
          brew style --cask Casks/contextlens.rb
          # Newer Homebrew refuses to audit casks from an untrusted tap. Trust is
          # granted only on this disposable runner, for this checked-out commit.
          brew trust Brendan-Lim/tap
          brew audit --cask --online Brendan-Lim/tap/contextlens
      - name: Style actual preview candidate
        if: hashFiles('Casks/contextlens-preview.rb') != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew tap --custom-remote Brendan-Lim/tap "$GITHUB_WORKSPACE"
          brew style --cask Brendan-Lim/tap/contextlens-preview
      - name: Disposable preview install and uninstall (no manual authorization)
        if: hashFiles('Casks/contextlens-preview.rb') != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: python3 scripts/test-preview-install.py
      - name: Audit and fetch actual preview candidate
        if: hashFiles('Casks/contextlens-preview.rb') != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          # Read-only job token (permissions: contents: read). Without it, Homebrew's
          # GitHub API calls share the runner IP's anonymous rate limit and fail.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        # Newer Homebrew no longer keeps the install's per-cask trust after
        # uninstall, and audits refuse untrusted taps. Trust is granted only on
        # this disposable runner, for this checked-out commit.
        run: |
          brew trust Brendan-Lim/tap
          brew audit --cask --online Brendan-Lim/tap/contextlens-preview
          brew fetch --cask Brendan-Lim/tap/contextlens-preview
